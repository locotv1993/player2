<script>

const params = new URLSearchParams(window.location.search);
const canal = params.get("canal");

if(canal){

    const videoUrl =
    "https://la14hd.com/vivo/canales.php?stream=" + canal;

    // ANDROID APP
    if(window.PlayerApp){

        PlayerApp.onPlay(
            canal,
            videoUrl,
            "",
            ""
        );

    } else {

        // WEB NORMAL
        location.href = videoUrl;

    }

}

</script>
