
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DT2 - Reproductor</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#080b12;color:#fff;font:15px Arial}
main{max-width:960px;margin:auto;padding:15px}
video{width:100%;aspect-ratio:16/9;background:#000}
#status{padding:15px;font-weight:bold}
pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#151c29;padding:12px;border-radius:8px}
input{width:100%;padding:12px;background:#151c29;color:white;border:1px solid #555}
button{padding:12px;background:#2563eb;color:white;border:0;margin-top:8px}
</style>
</head>
<body>
<main>
<h3>DT2 - Prueba de reproducción</h3>
<video id="video" controls playsinline autoplay></video>
<div id="status">Iniciando...</div>
<p id="info"></p>
<input id="url" placeholder="URL HLS autorizada (opcional)">
<button onclick="play(document.getElementById('url').value)">Reproducir</button>
<pre id="log"></pre>
</main>
<script>
const $ = id => document.getElementById(id);
const p = new URLSearchParams(location.search);
const m = p.get('m') || '4398539';
const s = p.get('s') || '914533';
const sp = p.get('sp') || '1';
let hls;

$('info').textContent = `Partido: ${m} | Señal: ${s} | Deporte: ${sp}`;

function log(t){
  $('log').textContent += t + '\n';
}
function status(t){
  $('status').textContent = t;
}
function play(url){
  try{
    const u = new URL(url);
    if(!['https:','http:'].includes(u.protocol))
      throw Error('URL inválida');

    const video = $('video');
    if(hls) hls.destroy();

    status('Cargando video...');
    if(Hls.isSupported()){
      hls = new Hls();
      hls.loadSource(u.href);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED,()=>{
        status('Video cargado');
        video.play().catch(()=>status('Pulsa Play'));
      });
      hls.on(Hls.Events.ERROR,(_,data)=>{
        log('HLS: '+data.details);
        if(data.fatal) status('Error: '+data.details);
      });
    }else if(video.canPlayType('application/vnd.apple.mpegurl')){
      video.src = u.href;
      video.play().catch(()=>status('Pulsa Play'));
    }else{
      status('Navegador sin soporte HLS');
    }
  }catch(e){
    status('URL no válida');
    log(e.message);
  }
}

function rot47(t){
  return t.replace(/[!-~]/g,c=>
    String.fromCharCode(33+(c.charCodeAt(0)-33+47)%94)
  );
}

function readVarint(a,pos){
  let n=0,shift=0;
  for(let i=0;i<10;i++){
    if(pos>=a.length) throw Error('Datos incompletos');
    const b=a[pos++];
    n+=(b&127)*2**shift;
    if(!(b&128)) return [n,pos];
    shift+=7;
  }
  throw Error('Varint inválido');
}

function parseFields(bytes){
  const out=[];
  let i=0;
  while(i<bytes.length){
    let tag;
    [tag,i]=readVarint(bytes,i);
    const id=Math.floor(tag/8);
    const wire=tag%8;
    if(!id || id>10000) throw Error('Campo inválido');

    if(wire===0){
      let value;
      [value,i]=readVarint(bytes,i);
      out.push({id,value});
    }else if(wire===2){
      let len;
      [len,i]=readVarint(bytes,i);
      if(len>bytes.length-i) throw Error('Longitud inválida');
      out.push({id,value:bytes.slice(i,i+len)});
      i+=len;
    }else if(wire===1 || wire===5){
      i+=wire===1?8:4;
      if(i>bytes.length) throw Error('Campo truncado');
    }else{
      throw Error('Formato no reconocido');
    }
  }
  return out;
}

function extractStrings(bytes,depth=0){
  const found=[];
  try{
    for(const field of parseFields(bytes)){
      if(!(field.value instanceof Uint8Array)) continue;
      const str=new TextDecoder().decode(field.value);
      if(str.length>3) found.push(str);
      if(depth<3)
        found.push(...extractStrings(field.value,depth+1));
    }
  }catch(e){}
  return found;
}

async function init(){
  const q=new URLSearchParams({
    streamId:s,
    siteType:p.get('siteType')||'2001',
    continent:p.get('continent')||'SA',
    country:p.get('country')||'EC',
    digit:p.get('digit')||'trd',
    matchId:m,
    sportType:sp
  });

  const endpoint='https://apis-data-defra10.tcpwe138stya.ru/api/stream/detail?'+q;

  status('Consultando señal...');
  log('Partido '+m+' - Señal '+s);

  try{
    const r=await fetch(endpoint,{cache:'no-store'});
    const bytes=new Uint8Array(await r.arrayBuffer());
    log('HTTP: '+r.status+' | Bytes: '+bytes.length);

    if(!r.ok) throw Error('HTTP '+r.status);

    const text=new TextDecoder().decode(bytes);

    if(text.includes('Stream Not Found')){
      status('Señal no encontrada');
      return;
    }

    const strings=extractStrings(bytes);
    log('Datos extraídos: '+strings.length);

    const urls=[];
    for(const str of strings){
      for(const value of [
        str,rot47(str),
        str.slice(8),rot47(str).slice(8),
        rot47(str.slice(8))
      ]){
        for(const match of value.matchAll(/https?:\/\/[^\s"'<>\\]+/g)){
          if(!urls.includes(match[0])) urls.push(match[0]);
        }
      }
    }

    const media=urls.find(u=>/\.m3u8(?:[?#]|$)/i.test(u));

    if(media){
      status('Intentando reproducir...');
      play(media);
    }else{
      status('Respuesta recibida, sin URL HLS directa');
      log('URLs detectadas: '+urls.length);
      log('La señal podría requerir autorización adicional.');
    }
  }catch(e){
    status('Error al consultar la señal');
    log(e.message);
  }
}
init();
</script>
</body>
</html>
