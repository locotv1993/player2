<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cargando...</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }
    </style>
</head>

<body>

<script>
(function () {

    const params = new URLSearchParams(window.location.search);
    const destino = params.get("ir");

    // Cargar el contenido
    if (destino) {
        const iframe = document.createElement("iframe");
        iframe.src = destino;
        iframe.allowFullscreen = true;
        document.body.appendChild(iframe);
    }

    // Preparar el historial para detectar ATRÁS
    history.pushState(null, "", location.href);

    window.addEventListener("popstate", function () {

        // Ir directamente a la agenda inicial
        window.location.replace(
            "https://ns1-app.competenciadeportiva.com/ap/636f6d2e6465706f726f726167656e64612e6563"
        );

    });

})();
</script>

</body>
</html>
