<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cargando...</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }
    </style>
</head>

<body>

<script>
(function () {

    const params = new URLSearchParams(window.location.search);
    const destino = params.get("ir");

    // Cargar el reproductor
    if (destino) {
        const iframe = document.createElement("iframe");
        iframe.src = destino;
        iframe.allowFullscreen = true;
        document.body.appendChild(iframe);
    }

    // Crear una entrada adicional en el historial
    history.pushState({ reproductor: true }, "", location.href);

    // Detectar cuando el usuario presiona ATRÁS
    window.addEventListener("popstate", function () {

        // Ir dos páginas atrás
        history.go(-2);

    });

})();
</script>

</body>
</html>
