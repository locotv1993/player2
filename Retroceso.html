<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cargando...</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }
    </style>
</head>

<body>

<script>
(function () {

    // Evita ejecutar el retroceso más de una vez
    if (sessionStorage.getItem("retrocesoEjecutado") === "1") {
        return;
    }

    // Marca que ya se ejecutó
    sessionStorage.setItem("retrocesoEjecutado", "1");

    // Espera 10 segundos
    setTimeout(function () {

        // Retrocede una sola vez
        if (window.history.length > 1) {
            window.history.back();
        }

    }, 10000);

})();
</script>

</body>
</html>
